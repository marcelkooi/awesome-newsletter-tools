name: Alphabetize README Lists

on:
  push:
    branches:
      - main
    paths:
      - README.md

jobs:
  alphabetize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Alphabetize lists
        run: python3 .github/scripts/alphabetize_readme.py README.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "chore: alphabetize README lists" && git push)
